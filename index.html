<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#5A5A40" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FDFCF8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151512" />
    <script>
      console.log('PWA: Initializing...');
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(reg => {
            console.log('PWA: SW registered', reg.scope);
            reg.onupdatefound = () => {
              const installingWorker = reg.installing;
              installingWorker.onstatechange = () => {
                if (installingWorker.state === 'installed') {
                  if (navigator.serviceWorker.controller) {
                    console.log('PWA: New content available, please refresh.');
                  } else {
                    console.log('PWA: Content cached for offline use.');
                  }
                }
              };
            };
          }).catch(err => {
            console.error('PWA: SW registration failed', err);
          });
        });
      } else {
        console.warn('PWA: Service Workers are not supported in this browser.');
      }
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Вера +1" />
    <meta name="application-name" content="Вера +1" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/logo.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logo.png" />
    <link rel="shortcut icon" href="/logo.png" />
    <title>Вера Тренажёр</title>
  </head>
  <body>
    <noscript>
      <div style="height: 100vh; display: flex; align-items: center; justify-content: center; background: #fcfdfd; font-family: sans-serif; text-align: center; padding: 20px;">
        <div>
          <h1 style="color: #ef4444;">JavaScript отключен</h1>
          <p style="color: #6b7280;">Для работы тренажёра необходимо включить JavaScript в настройках браузера.</p>
        </div>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
