<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    
    <!-- Theme colors for blending browser bar -->
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1C1C18" media="(prefers-color-scheme: dark)" />
    
    <!-- IOS specific tags to hide browser UI when added to home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Вера +1" />
    
    <!-- Icons for Home Screen -->
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="shortcut icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />

    <title>Вера Тренажёр</title>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
  </head>
  <body>
    <noscript>
      <div style="height: 100vh; display: flex; align-items: center; justify-content: center; background: #fcfdfd; font-family: sans-serif; text-align: center; padding: 20px;">
        <div>
          <h1 style="color: #ef4444;">JavaScript отключен</h1>
          <p style="color: #6b7280;">Для работы тренажёра необходимо включить JavaScript в настройках браузера.</p>
        </div>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
